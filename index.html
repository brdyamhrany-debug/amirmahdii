<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>امیر مهدی در کلاس ICDL</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Vazirmatn", "Tahoma", sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #0d47a1, #1976d2, #42a5f5, #0288d1);
    background-size: 300% 300%;
    animation: bgMove 8s ease infinite;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  @keyframes bgMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .card {
    background: rgba(255,255,255,0.95);
    border-radius: 25px;
    padding: 50px 60px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    max-width: 600px;
    width: 100%;
    border: 4px solid #fff;
  }
  .emoji-top {
    font-size: 60px;
    margin-bottom: 15px;
    animation: bounce 1.5s ease infinite;
  }
  @keyframes bounce {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }
  h1 {
    color: #0d47a1;
    font-size: 38px;
    line-height: 1.8;
    margin-bottom: 10px;
  }
  h1 .highlight {
    background: #0d47a1;
    color: #fff;
    padding: 5px 20px;
    border-radius: 15px;
    display: inline-block;
  }
  p {
    color: #1565c0;
    font-size: 22px;
    margin-top: 15px;
  }
  .badge {
    display: inline-block;
    margin-top: 20px;
    background: #0288d1;
    color: white;
    padding: 10px 30px;
    border-radius: 50px;
    font-size: 20px;
    font-weight: bold;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="emoji-top">✌️😭</div>
    <h1>امیر مهدی<br>در کلاس ICDL</h1>
    <p>با محیط آبی رنگ!</p>
    <div class="badge">ICDL Class 💻</div>
  </div>
</body>
</html>
